name: iOS Release Build & Upload to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: KimkoCLI
  BUNDLE_ID: com.elcomlab.elcomcli

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned iOS SSH dependencies
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
          fi
          chmod +x scripts/build-ios-ssh-deps.sh
          scripts/build-ios-ssh-deps.sh "$RUNNER_TEMP/elcomcli-ios-deps"
          echo "ELCOMCLI_LIBSSH2_ROOT=$RUNNER_TEMP/elcomcli-ios-deps" >> "$GITHUB_ENV"

      - name: Verify iOS SSH module autolinking
        run: |
          pnpm exec expo-modules-autolinking resolve --platform apple --json > "$RUNNER_TEMP/elcomcli-ios-autolinking.json"
          node - "$RUNNER_TEMP/elcomcli-ios-autolinking.json" <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const module = result.modules?.find((entry) => entry.packageName === '@elcomcli/ssh-client');
          if (!module) {
            throw new Error('iOS SSH module was not resolved by Expo autolinking');
          }
          const pod = module.pods?.find((entry) => entry.podName === 'ElcomcliSshClient');
          if (!pod) {
            throw new Error('ElcomcliSshClient Podspec was not resolved by Expo autolinking');
          }
          console.log(`Resolved ${module.packageName} with pod ${pod.podName} at ${pod.podspecDir}`);
          NODE

      - name: Read version from app.json
        id: version
        run: |
          chmod +x scripts/version.sh
          source <(scripts/version.sh)
          echo "MARKETING_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "App version: $VERSION (build $BUILD_NUMBER)"

      - name: Write build number to app.json
        run: |
          echo "Writing ios.buildNumber = ${{ steps.version.outputs.CURRENT_PROJECT_VERSION }} to app.json"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.ios.buildNumber = '${{ steps.version.outputs.CURRENT_PROJECT_VERSION }}';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

      - name: Create .env file from secrets
        run: |
          echo 'EXPO_PUBLIC_OPENROUTER_URL=https://openrouter.ai/api/v1/chat/completions' >> .env
          echo 'EXPO_PUBLIC_UPDATE_URL=https://cli.elcomlab.site/version.json' >> .env
          echo 'EXPO_PUBLIC_OPENROUTER_KEYS_URL=https://openrouter.ai/keys' >> .env
          echo 'EXPO_PUBLIC_LANDING_PAGE_URL=https://cli.elcomlab.site' >> .env
          echo 'EXPO_PUBLIC_MODELS_URL=https://cli.elcomlab.site/models.json' >> .env
          echo "EXPO_PUBLIC_GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> .env
          echo "EXPO_PUBLIC_GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> .env

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # Create and unlock a temporary secure keychain
          security create-keychain -p "temporary_password" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "temporary_password" $KEYCHAIN_PATH

          # Import P12 certificate into keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Grant codesign access to the certificate to prevent CI hanging
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporary_password" $KEYCHAIN_PATH

          # Extract the UUID from the Provisioning Profile
          PROFILE_UUID=$(security cms -D -i $PP_PATH | grep -A1 UUID | grep string | awk -F'>|<' '{print $3}')
          echo "Extracted UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          # Install the Provisioning Profile using the UUID as the filename
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate Native iOS Directory (Expo Prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install
          WORKSPACE_PATH=$(find "$PWD" -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "No Xcode workspace was generated by CocoaPods"
            ls -la
            exit 1
          fi
          WORKSPACE_NAME=$(basename "$WORKSPACE_PATH")
          SCHEME_LIST=$(xcodebuild -list -workspace "$WORKSPACE_PATH" | sed -n '/Schemes:/,$p' | sed -n '/^[[:space:]]*[A-Za-z0-9_.-][A-Za-z0-9_.-]*[[:space:]]*$/p' | xargs -n 1)
          SCHEME_NAME=$(printf '%s\n' "$SCHEME_LIST" | grep -x "$APP_NAME" | head -n 1 || true)
          if [ -z "$SCHEME_NAME" ]; then
            echo "Application scheme '$APP_NAME' was not found. Available schemes:"
            printf '%s\n' "$SCHEME_LIST"
            exit 1
          fi
          if [ -z "$SCHEME_NAME" ]; then
            echo "No Xcode scheme was found in $WORKSPACE_NAME"
            xcodebuild -list -workspace "$WORKSPACE_PATH"
            exit 1
          fi
          echo "IOS_WORKSPACE=$WORKSPACE_NAME" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME_NAME" >> "$GITHUB_ENV"
          echo "Using workspace $WORKSPACE_NAME and scheme $SCHEME_NAME"

      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Build Archive & IPA via xcodebuild
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios
          echo "Using Profile UUID: $PROFILE_UUID"
          xcodebuild -workspace "$IOS_WORKSPACE" \
                     -scheme "$IOS_SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $RUNNER_TEMP/$APP_NAME.xcarchive \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
                     PROVISIONING_PROFILE="$PROFILE_UUID" \
                     PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
                     CODE_SIGN_STYLE="Manual" \
                      CODE_SIGN_IDENTITY="Apple Distribution" \
                      MARKETING_VERSION="${{ steps.version.outputs.MARKETING_VERSION }}" \
                      CURRENT_PROJECT_VERSION="${{ steps.version.outputs.CURRENT_PROJECT_VERSION }}" \
                      archive

          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/$APP_NAME.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/build

      - name: Locate Exported IPA File
        id: find_ipa
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/build -name "*.ipa" | head -n 1)
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "Found IPA at: $IPA_FILE"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ steps.find_ipa.outputs.ipa_path }}

      - name: Upload to Apple TestFlight (Direct altool)
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IPA_PATH: ${{ steps.find_ipa.outputs.ipa_path }}
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --app-id 6773801672
